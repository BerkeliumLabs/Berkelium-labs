<div class="flex items-center justify-around px-4 gap-4">
  <mat-card appearance="outlined" class="bkl__panel w-80">
    <mat-card-header>
      <mat-card-title>Sources</mat-card-title>
    </mat-card-header>
  </mat-card>
  <mat-card appearance="outlined" class="bkl__panel flex-grow">
    <mat-card-header>
      <mat-card-title>Chat</mat-card-title>
    </mat-card-header>
    <mat-card-content class="flex-grow">
      <p>chat area</p>
    </mat-card-content>
    <mat-card-footer>
      <form class="bkl__chatbox m-3 p-4 gap-4" [formGroup]="chatForm">
        <textarea
          class="flex-grow !bg-transparent resize-none border-none outline-none focus:ring-0 !text-sm w-full"
          placeholder="Type your prompt..."
          formControlName="prompt"
        ></textarea>
        <div class="bkl__chat-actions flex items-center justify-end">
          <div class="flex">
            <button
              matMiniFab
              aria-label="Send"
              (click)="sendPrompt()"
              [disabled]="chatForm.invalid"
            >
              <mat-icon>send</mat-icon>
            </button>
          </div>
        </div>
      </form>
    </mat-card-footer>
  </mat-card>
</div>
